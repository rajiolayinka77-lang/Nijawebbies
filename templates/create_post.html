<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Post - NijaWebbies</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 16px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 7px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 250px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: #2563eb;
        }

        .message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 7px;
            background: #eef6ff;
        }
    </style>
</head>

<body>

<header>
    <h1>🇳🇬 NijaWebbies</h1>
</header>

<div class="container">

    <div class="card">

        <h2>✍️ Create a Post</h2>

        <p>Share your story, news, ideas, or useful information with the NijaWebbies community.</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <label for="title">Post Title</label>
            <input
                type="text"
                id="title"
                name="title"
                placeholder="Enter your post title"
                required
            >

            <label for="category">Category</label>
            <select id="category" name="category">
                <option value="General">General</option>
                <option value="News">News</option>
                <option value="Business">Business</option>
                <option value="Technology">Technology</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Lifestyle">Lifestyle</option>
                <option value="Education">Education</option>
                <option value="Community">Community</option>
            </select>

            <label for="content">Post Content</label>
            <textarea
                id="content"
                name="content"
                placeholder="Write your post here..."
                required
            ></textarea>

            <button type="submit">
                🚀 Publish Post
            </button>

        </form>

        <a class="back" href="{{ url_for('workspace') }}">
            ← Back to Workspace
        </a>

    </div>

</div>

</body>
</html>
