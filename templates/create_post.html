<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - NijaWebbies</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 0;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        textarea {
            min-height: 250px;
            resize: vertical;
        }

        button {
            margin-top: 22px;
            background: #16a34a;
            color: white;
            border: none;
            padding: 13px 22px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <strong>🇳🇬 NijaWebbies</strong>
</header>

<div class="container">

    <h1>✍️ Create a Post</h1>
    <p>Share your ideas, stories, projects or useful information with the NijaWebbies community.</p>

    <form method="POST">

        <label for="title">Post Title</label>
        <input
            type="text"
            id="title"
            name="title"
            placeholder="Enter your post title"
            required
        >

        <label for="category">Category</label>
        <select id="category" name="category">
            <option value="General">General</option>
            <option value="Business">Business</option>
            <option value="Technology">Technology</option>
            <option value="Education">Education</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Lifestyle">Lifestyle</option>
            <option value="Projects">Projects</option>
            <option value="News">News</option>
        </select>

        <label for="content">Content</label>
        <textarea
            id="content"
            name="content"
            placeholder="Write your post here..."
            required
        ></textarea>

        <button type="submit">🚀 Publish Post</button>

    </form>

    <a class="back" href="{{ url_for('workspace') }}">← Back to Workspace</a>

</div>

</body>
</html>
