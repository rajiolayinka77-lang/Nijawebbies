<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }} - NijaWebbies</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px;
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .meta {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .content {
            font-size: 18px;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .back {
            display: inline-block;
            margin-top: 30px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <strong>🇳🇬 NijaWebbies</strong>
</header>

<div class="container">

    <h1>{{ post.title }}</h1>

    <div class="meta">
        {% if post.category %}
            📂 {{ post.category }}
        {% endif %}

        {% if post.created_at %}
            · 🗓️ {{ post.created_at }}
        {% endif %}
    </div>

    <div class="content">
        {{ post.content }}
    </div>

    <a class="back" href="{{ url_for('blog') }}">← Back to Blog</a>

</div>

</body>
</html>
